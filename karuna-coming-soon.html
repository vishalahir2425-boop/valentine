<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Something special for Karuna 💕</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --rose: #e91e63;
      --rose-light: #f8bbd9;
      --rose-dark: #c2185b;
      --gold: #d4af37;
      --cream: #fff9fb;
      --shadow: rgba(233, 30, 99, 0.2);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      caret-color: transparent;
    }

    body {
      font-family: 'Outfit', sans-serif;
      min-height: 100vh;
      overflow-x: hidden;
      background: linear-gradient(160deg, #fff9fb 0%, #ffe8f0 35%, #ffdde8 70%, #ffe4ec 100%);
      color: #4a2c35;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      text-align: center;
      position: relative;
    }

    /* Soft floating shapes */
    .bg-shapes {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      overflow: hidden;
    }
    .shape {
      position: absolute;
      border-radius: 50%;
      opacity: 0.08;
      animation: floatShape 12s ease-in-out infinite;
    }
    .shape-1 { width: 300px; height: 300px; background: var(--rose); left: -100px; top: 20%; animation-delay: 0s; }
    .shape-2 { width: 200px; height: 200px; background: var(--gold); right: -50px; top: 50%; animation-delay: 2s; }
    .shape-3 { width: 150px; height: 150px; background: var(--rose-light); left: 30%; bottom: 10%; animation-delay: 4s; }
    @keyframes floatShape {
      0%, 100% { transform: translate(0, 0) scale(1); }
      33% { transform: translate(20px, -30px) scale(1.05); }
      66% { transform: translate(-15px, 20px) scale(0.98); }
    }

    /* Sparkles */
    .sparkle {
      position: absolute;
      font-size: 1rem;
      opacity: 0.2;
      animation: sparkle 3s ease-in-out infinite;
    }
    .sparkle:nth-child(1) { left: 15%; top: 25%; animation-delay: 0s; }
    .sparkle:nth-child(2) { right: 20%; top: 30%; animation-delay: 0.5s; }
    .sparkle:nth-child(3) { left: 25%; bottom: 35%; animation-delay: 1s; }
    .sparkle:nth-child(4) { right: 15%; bottom: 25%; animation-delay: 1.5s; }
    .sparkle:nth-child(5) { left: 50%; top: 15%; animation-delay: 2s; }
    @keyframes sparkle {
      0%, 100% { opacity: 0.15; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(1.2); }
    }

    .content {
      position: relative;
      z-index: 1;
      max-width: 520px;
      width: 100%;
      animation: fadeUp 1s ease-out;
    }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(30px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .label {
      font-family: 'Cormorant Garamond', serif;
      font-size: 1rem;
      font-weight: 400;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      color: var(--rose-dark);
      margin-bottom: 0.5rem;
      opacity: 0.9;
    }

    .name {
      font-family: 'Cormorant Garamond', serif;
      font-size: clamp(3rem, 12vw, 5rem);
      font-weight: 600;
      color: var(--rose-dark);
      line-height: 1.1;
      margin-bottom: 0.25rem;
      text-shadow: 0 4px 20px var(--shadow);
      letter-spacing: 0.02em;
    }

    .name-sub {
      font-family: 'Cormorant Garamond', serif;
      font-size: clamp(1.4rem, 4vw, 1.8rem);
      font-weight: 400;
      font-style: italic;
      color: #7d4a5a;
      margin-bottom: 2rem;
    }

    .message {
      font-size: 1.05rem;
      line-height: 1.7;
      color: #5c3a45;
      margin-bottom: 2rem;
      font-weight: 400;
    }

    .coming-box {
      background: rgba(255, 255, 255, 0.7);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-radius: 24px;
      padding: 2rem 2.5rem;
      margin: 2rem 0;
      box-shadow: 0 15px 50px var(--shadow);
      border: 2px solid rgba(233, 30, 99, 0.15);
      position: relative;
      overflow: hidden;
    }
    .coming-box::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 4px;
      background: linear-gradient(90deg, transparent, var(--rose-light), var(--rose), var(--rose-light), transparent);
      opacity: 0.6;
    }
    .coming-box .title {
      font-family: 'Cormorant Garamond', serif;
      font-size: clamp(1.6rem, 4vw, 2rem);
      font-weight: 600;
      color: var(--rose-dark);
      margin-bottom: 0.5rem;
    }
    .coming-box .sub {
      font-size: 0.95rem;
      color: #7d4a5a;
      font-weight: 400;
    }

    .hearts-row {
      display: flex;
      justify-content: center;
      gap: 0.75rem;
      margin-top: 2rem;
      flex-wrap: wrap;
    }
    .hearts-row span {
      font-size: 1.5rem;
      opacity: 0.6;
      animation: heartFloat 2.5s ease-in-out infinite;
    }
    .hearts-row span:nth-child(1) { animation-delay: 0s; }
    .hearts-row span:nth-child(2) { animation-delay: 0.3s; }
    .hearts-row span:nth-child(3) { animation-delay: 0.6s; }
    .hearts-row span:nth-child(4) { animation-delay: 0.9s; }
    .hearts-row span:nth-child(5) { animation-delay: 1.2s; }
    @keyframes heartFloat {
      0%, 100% { transform: translateY(0); opacity: 0.6; }
      50% { transform: translateY(-8px); opacity: 1; }
    }

  </style>
</head>
<body>
  <div class="bg-shapes">
    <div class="shape shape-1"></div>
    <div class="shape shape-2"></div>
    <div class="shape shape-3"></div>
  </div>
  <div class="bg-shapes">
    <span class="sparkle">✦</span>
    <span class="sparkle">✧</span>
    <span class="sparkle">✦</span>
    <span class="sparkle">✧</span>
    <span class="sparkle">✦</span>
  </div>

  <main class="content">
    <p class="label">For you</p>
    <h1 class="name">Karuna</h1>
    <p class="name-sub">something special is on its way</p>

    <p class="message">
      A little surprise is being made just for you. Good things take a little time—and you're worth the wait.
    </p>

    <div class="coming-box">
      <p class="title">Coming soon</p>
      <p class="sub">Stay tuned. Something beautiful is being prepared. 💕</p>
    </div>

    <div class="hearts-row">
      <span>💕</span>
      <span>💗</span>
      <span>❤️</span>
      <span>💗</span>
      <span>💕</span>
    </div>
  </main>
</body>
</html>
